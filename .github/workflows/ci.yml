name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend — tipos, lint, testes, build e e2e
    runs-on: ubuntu-latest
    # 30 min: a instalação do navegador do Playwright (com as dependências do sistema) já levou 14 min num
    # runner lento e estourou os 20 de antes no meio do Lighthouse, com todos os testes verdes.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalação limpa
        run: npm ci

      - name: Verificação de tipos
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Testes unitários e de componentes
        run: npm test

      - name: Build de produção (subcaminho do GitHub Pages)
        run: npm run build:pages

      - name: Orçamento de tamanho (gzip)
        run: npm run check:budget

      # O navegador fica em cache (chave: a versão do Playwright no lockfile); com cache, só as dependências
      # do sistema são instaladas.
      - name: Cache do navegador do Playwright
        id: pw-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Instalar Chromium do Playwright
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Dependências do sistema para o Chromium (com o navegador em cache)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Testes de navegador (build servido em /site_bezalel/)
        run: npm run test:e2e
        env:
          PW_CHANNEL: chromium

      - name: Relatório do Playwright
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

      # Lighthouse em modo celular (3 rodadas por página, servidor com gzip
      # igual ao GitHub Pages). Acessibilidade e CLS bloqueiam; desempenho
      # avisa — a máquina do CI varia demais para ser porteira.
      - name: Lighthouse CI
        run: npm run lighthouse

      - name: Relatórios do Lighthouse
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse
          path: .lighthouseci
          retention-days: 14

  backend:
    name: Backend de referência (server/)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: server/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
